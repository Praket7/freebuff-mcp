name: CI
on:
  push:
  pull_request:

# Keep only the newest CI run per branch/ref. This prevents stale matrices from
# monopolizing hosted-runner capacity after a follow-up fix is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # pnpm 11 requires Node >= 22.13; use pnpm 9 on Node 20.
          version: ${{ matrix.node == 20 && 9 || 11 }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm typecheck:test
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack --pack-destination work
      - name: Package smoke test
        shell: bash
        run: |
          cd work
          TGZ=$(ls freebuff-mcp-*.tgz | head -1)
          npm install --no-save --prefix "$PWD/smoke" "$PWD/$TGZ"
          node "$PWD/smoke/node_modules/freebuff-mcp/dist/src/cli.js" version
          # doctor exits 1 when no Freebuff installation exists (as in CI), so
          # capture the status instead of tripping `set -e`, then verify the
          # exit code matches the machine-readable report exactly.
          set +e
          node "$PWD/smoke/node_modules/freebuff-mcp/dist/src/cli.js" doctor --json > doctor.json
          DOCTOR_STATUS=$?
          set -e
          DOCTOR_STATUS="$DOCTOR_STATUS" node -e "const r = require('./doctor.json'); if (typeof r.ok !== 'boolean') { console.error('doctor --json did not parse'); process.exit(2); } if (r.ok && Number(process.env.DOCTOR_STATUS) !== 0) { console.error('expected exit 0 with ok:true'); process.exit(2); } if (!r.ok && Number(process.env.DOCTOR_STATUS) !== 1) { console.error('expected exit 1 with ok:false'); process.exit(2); } console.log('doctor smoke ok:', JSON.stringify({ ok: r.ok, status: Number(process.env.DOCTOR_STATUS) }));"
          node "$PWD/smoke/node_modules/freebuff-mcp/dist/src/cli.js" install codex | head -3
          node "$PWD/smoke/node_modules/freebuff-mcp/dist/src/cli.js" install claude | head -3
