name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # pnpm 11 requires Node >= 22.13; use pnpm 9 on Node 20.
          version: ${{ matrix.node == 20 && 9 || 11 }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm typecheck:test
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack --pack-destination work
      - name: Package smoke test
        shell: bash
        run: |
          cd work
          TGZ=$(ls freebuff-mcp-*.tgz | head -1)
          npm install --no-save --prefix "$PWD/smoke" "$PWD/$TGZ"
          node "$PWD/smoke/node_modules/freebuff-mcp/dist/src/cli.js" version
          node "$PWD/smoke/node_modules/freebuff-mcp/dist/src/cli.js" doctor --json > /dev/null
          node "$PWD/smoke/node_modules/freebuff-mcp/dist/src/cli.js" install codex | head -3
          node "$PWD/smoke/node_modules/freebuff-mcp/dist/src/cli.js" install claude | head -3
